name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker available on the runner.
      - name: Build and test (unit + integration, coverage >= 80%)
        run: ./mvnw -B verify

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

      # Images are built locally on the runner only. Publishing to GHCR comes later,
      # once the repository exists: add a login step (docker/login-action with GITHUB_TOKEN,
      # permissions: packages: write) and use `jib:build -Djib.to.image=ghcr.io/<owner>/<name>`.
      - name: Build Docker images (no publish)
        run: ./mvnw -B -pl jobs-service,api-gateway -am -DskipTests package jib:dockerBuild
